# ??? ??????????
spring.application.name=digital-library-backend-test

# H2 in-memory database (????? PostgreSQL ??? ?????????????)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=POSTGRESQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ????????? ????????? DDL ????? Spring (?????????? ?????? ddl-auto)
spring.jpa.generate-ddl=false

# H2 Console (??? ???????)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ????????? Flyway ? ??????
spring.flyway.enabled=false

# ????????? ???? ?????????? (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ??????????? ???????? ??????????
app.books.storage-path=D:/test-library

# ??????????? SQL (???????????, ????? ????????)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE