# Prometheus Configuration
global:
  scrape_interval: 15s      # Как часто собирать метрики
  evaluation_interval: 15s  # Как часто проверять правила
  external_labels:
    cluster: 'digital-library'
    environment: 'docker'

# Alertmanager (опционально, пока закомментировано)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Правила (пока не используем)
# rule_files:
#   - "alerts/*.yml"

# Источники метрик
scrape_configs:
  # ========== Prometheus сам себя ==========
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'

  # ========== Spring Boot Backend ==========
  - job_name: 'spring-boot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          app: 'digital-library-backend'
          instance: 'backend-1'
    # Дополнительные метрики
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1'

  # ========== PostgreSQL Exporter (если добавите позже) ==========
