<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Library</title>
  <style>
    :root {
        /* Светлая бежевая тема */
        --beige-50: #fdf8f0;
        --beige-100: #f9f0e3;
        --beige-200: #f0e4d3;
        --beige-300: #e6d7c3;
        --beige-400: #d2c1a8;
        --beige-500: #bdae8f;
        --beige-600: #9c8c6f;
        --beige-700: #7a6d55;
        --beige-800: #584e3b;
        --beige-900: #362f22;

        --text-primary: #3a3228;
        --text-secondary: #6b5e51;
        --text-tertiary: #9c8c7a;

        --active-bg: rgba(156, 140, 111, 0.15);
        --hover-bg: rgba(156, 140, 111, 0.08);
        --border-color: rgba(156, 140, 111, 0.2);
        --shadow-color: rgba(58, 50, 40, 0.15);

        --canvas-bg: var(--beige-100);
        --canvas-text: var(--text-primary);
        --gray-text: var(--text-secondary);
    }

    /* Светлая молочно-кремовая тема */
    .theme-light {
        --beige-50: #fefcf8;
        --beige-100: #f9f5f0;
        --beige-200: #f0e8d8;
        --beige-300: #e6d9c3;
        --beige-400: #d2c1a8;
        --beige-500: #bdae8f;
        --beige-600: #9c8c6f;
        --beige-700: #7a6d55;
        --beige-800: #584e3b;
        --beige-900: #362f22;

        --text-primary: #2d2518;
        --text-secondary: #5a4f3f;
        --text-tertiary: #8a7d6a;

        --active-bg: rgba(156, 140, 111, 0.12);
        --hover-bg: rgba(156, 140, 111, 0.06);
        --border-color: rgba(156, 140, 111, 0.15);
        --shadow-color: rgba(45, 37, 24, 0.08);

        --canvas-bg: var(--beige-50);
        --canvas-text: var(--text-primary);
        --gray-text: var(--text-secondary);
    }

    /* Стили для прогресс-слайдера в светлой теме */
    .theme-light #progress-slider {
        accent-color: var(--beige-600);
    }

    .theme-light #progress-slider::-webkit-slider-track {
        background: var(--beige-200);
    }

    .theme-light #progress-slider::-webkit-slider-thumb {
        background: var(--beige-600);
        border: 2px solid var(--beige-50);
    }

    .theme-light #tick-marks option {
        color: var(--text-primary);
        background-color: var(--beige-50);
    }

    /* Темная тема */
    .theme-dark {
        --beige-50: #2a241d;
        --beige-100: #362f27;
        --beige-200: #4a4137;
        --beige-300: #5e5347;
        --beige-400: #7a6d5d;
        --beige-500: #968773;
        --beige-600: #b29f89;
        --beige-700: #ceb79f;
        --beige-800: #e5d1b9;
        --beige-900: #f5eadc;

        --text-primary: #f5eadc;
        --text-secondary: #d9cbbd;
        --text-tertiary: #bdae9f;

        --active-bg: rgba(178, 159, 137, 0.2);
        --hover-bg: rgba(178, 159, 137, 0.12);
        --border-color: rgba(178, 159, 137, 0.25);
        --shadow-color: rgba(0, 0, 0, 0.3);

        --canvas-bg: var(--beige-100);
        --canvas-text: var(--text-primary);
        --gray-text: var(--text-secondary);
    }

    /* Стили для прогресс-слайдера в темной теме */
    .theme-dark #progress-slider {
        accent-color: var(--beige-600);
    }

    .theme-dark #progress-slider::-webkit-slider-track {
        background: var(--beige-200);
    }

    .theme-dark #progress-slider::-webkit-slider-thumb {
        background: var(--beige-600);
        border: 2px solid var(--beige-100);
    }

    .theme-dark #tick-marks option {
        color: var(--text-primary);
        background-color: var(--beige-100);
    }

    @supports (color-scheme: light dark) {
        @media (prefers-color-scheme: dark) {
            :root:not(.theme-light):not(.theme-dark) {
                --beige-50: #2a241d;
                --beige-100: #362f27;
                --beige-200: #4a4137;
                --beige-300: #5e5347;
                --beige-400: #7a6d5d;
                --beige-500: #968773;
                --beige-600: #b29f89;
                --beige-700: #ceb79f;
                --beige-800: #e5d1b9;
                --beige-900: #f5eadc;

                --text-primary: #f5eadc;
                --text-secondary: #d9cbbd;
                --text-tertiary: #bdae9f;

                --active-bg: rgba(178, 159, 137, 0.2);
                --hover-bg: rgba(178, 159, 137, 0.12);
                --border-color: rgba(178, 159, 137, 0.25);
                --shadow-color: rgba(0, 0, 0, 0.3);

                --canvas-bg: var(--beige-100);
                --canvas-text: var(--text-primary);
                --gray-text: var(--text-secondary);
            }
        }
    }

    html {
        height: 100%;
    }

    body {
        margin: 0 auto;
        height: 100%;
        font: menu;
        font-family: system-ui, sans-serif;
        background-color: var(--canvas-bg);
        color: var(--canvas-text);
    }

    .toolbar {
        box-sizing: border-box;
        position: absolute;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 48px;
        padding: 6px;
        transition: opacity 250ms ease;
        visibility: hidden;
        background-color: var(--canvas-bg);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-color);
    }

    .toolbar button {
        padding: 3px;
        border-radius: 6px;
        background: none;
        border: 0;
        color: var(--gray-text);
    }

    .toolbar button:hover {
        background: var(--hover-bg);
        color: var(--text-primary);
    }

    #header-bar {
        top: 0;
    }

    #nav-bar {
        bottom: 0;
    }

    #progress-slider {
        flex-grow: 1;
        margin: 0 12px;
        visibility: hidden;
        accent-color: var(--beige-600);
    }

    #side-bar {
        visibility: hidden;
        box-sizing: border-box;
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        height: 100%;
        width: 320px;
        transform: translateX(-320px);
        display: flex;
        flex-direction: column;
        background: var(--canvas-bg);
        color: var(--canvas-text);
        box-shadow: 0 0 0 1px var(--border-color), 0 0 40px var(--shadow-color);
        transition: visibility 0s linear 300ms, transform 300ms ease;
        border-right: 1px solid var(--border-color);
    }

    #side-bar.show {
        visibility: visible;
        transform: translateX(0);
        transition-delay: 0s;
    }

    #dimming-overlay {
        visibility: hidden;
        position: fixed;
        z-index: 2;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--shadow-color);
        opacity: 0;
        transition: visibility 0s linear 300ms, opacity 300ms ease;
    }

    #dimming-overlay.show {
        visibility: visible;
        opacity: 1;
        transition-delay: 0s;
    }

    #side-bar-header {
        padding: 1rem;
        display: flex;
        border-bottom: 1px solid var(--border-color);
        align-items: center;
        background-color: var(--beige-50);
    }

    #side-bar-cover {
        height: 10vh;
        min-height: 60px;
        max-height: 180px;
        border-radius: 3px;
        border: 0;
        background: var(--beige-200);
        box-shadow: 0 0 1px var(--shadow-color), 0 0 16px var(--shadow-color);
        margin-inline-end: 1rem;
    }

    #side-bar-cover:not([src]) {
        display: none;
    }

    #side-bar-title {
        margin: .5rem 0;
        font-size: inherit;
        color: var(--text-primary);
    }

    #side-bar-author {
        margin: .5rem 0;
        font-size: small;
        color: var(--gray-text);
    }

    #toc-view {
        padding: .5rem;
        overflow-y: scroll;
        background-color: var(--canvas-bg);
    }

    #toc-view li, #toc-view ol {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    #toc-view a, #toc-view span {
        display: block;
        border-radius: 6px;
        padding: 8px;
        margin: 2px 0;
    }

    #toc-view a {
        color: var(--text-primary);
        text-decoration: none;
    }

    #toc-view a:hover {
        background: var(--hover-bg);
    }

    #toc-view span {
        color: var(--gray-text);
    }

    #toc-view svg {
        margin-inline-start: -24px;
        padding-inline-start: 5px;
        padding-inline-end: 6px;
        fill: var(--text-primary);
        cursor: default;
        transition: transform .2s ease;
        opacity: .6;
    }

    #toc-view svg:hover {
        opacity: 1;
    }

    #toc-view [aria-current] {
        font-weight: bold;
        background: var(--active-bg);
        color: var(--beige-700);
    }

    #toc-view [aria-expanded="false"] svg {
        transform: rotate(-90deg);
    }

    #toc-view [aria-expanded="false"] + [role="group"] {
        display: none;
    }

    .menu-container {
        position: relative;
    }

    .menu, .menu ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .menu {
        visibility: hidden;
        position: absolute;
        right: 0;
        background: var(--canvas-bg);
        color: var(--canvas-text);
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--border-color), 0 0 16px var(--shadow-color);
        padding: 6px;
        cursor: default;
        border: 1px solid var(--border-color);
    }

    .menu.show {
        visibility: visible;
    }

    .menu li {
        padding: 6px 12px;
        padding-left: 24px;
        border-radius: 6px;
        color: var(--text-primary);
    }

    .menu li:hover {
        background: var(--hover-bg);
    }

    .menu li[aria-checked="true"] {
        background-position: center left;
        background-repeat: no-repeat;
        background-image: url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%20fill%3D%22%239c8c6f%22%2F%3E%3C%2Fsvg%3E');
    }

    .menu-control-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 12px;
        border-radius: 6px;
        color: var(--text-primary);
        margin: 2px 0;
    }

    .menu-control-group:hover {
        background: var(--hover-bg);
    }

    .menu-control-label {
        font-size: 14px;
        font-weight: 500;
    }

    .menu-control-buttons {
        display: flex;
        gap: 4px;
    }

    .menu-control-btn {
        width: 24px;
        height: 24px;
        border: 1px solid var(--border-color);
        border-radius: 4px;
        background: var(--canvas-bg);
        color: var(--text-primary);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .menu-control-btn:hover {
        background: var(--hover-bg);
        border-color: var(--beige-600);
    }

    .menu-control-btn:active {
        background: var(--active-bg);
        transform: scale(0.95);
    }

    .popover {
        background: var(--canvas-bg);
        color: var(--canvas-text);
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--border-color), 0 0 16px var(--shadow-color), 0 0 32px var(--shadow-color);
        border: 1px solid var(--border-color);
    }

    .popover-arrow-down {
        fill: var(--canvas-bg);
        filter: drop-shadow(0 -1px 0 var(--border-color));
    }

    .popover-arrow-up {
        fill: var(--canvas-bg);
        filter: drop-shadow(0 1px 0 var(--border-color));
    }

    #page-number-display {
        color: var(--gray-text) !important;
        font-size: 14px;
        font-weight: 500;
        text-align: center;
        padding: 0 10px;
        white-space: nowrap;
    }
  </style>
  </head>
  <body>
    <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
  </body>
</html>
