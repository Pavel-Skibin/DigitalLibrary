services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: dl-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USERNAME: ${DB_USERNAME:-digital_library_user}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dl-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dl-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' 2>/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  # ─── Java Microservices ───────────────────────────────────────────────────────

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: dl-user-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users_db
      DB_USERNAME: ${DB_USERNAME:-digital_library_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-digital_library_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  book-catalog-service:
    build:
      context: .
      dockerfile: services/book-catalog-service/Dockerfile
    container_name: dl-book-catalog
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: "8091"
      DB_URL: jdbc:postgresql://postgres:5432/books_db
      DB_USERNAME: ${DB_USERNAME:-digital_library_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/books_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-digital_library_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_BOOKS_STORAGE_PATH: /app/books
      COMMENT_RATING_SERVICE_URL: http://comment-rating-service:8082
      USER_SERVICE_URL: http://user-service:8081
    volumes:
      - ${BOOKS_PATH:-./books}:/app/books
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  comment-rating-service:
    build:
      context: .
      dockerfile: services/comment-rating-service/Dockerfile
    container_name: dl-comment-rating
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/comments_ratings_db
      DB_USERNAME: ${DB_USERNAME:-digital_library_user}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comments_ratings_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-digital_library_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      BOOK_SERVICE_URL: http://book-catalog-service:8091
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  storage-service:
    build:
      context: .
      dockerfile: services/storage-service/Dockerfile
    container_name: dl-storage
    ports:
      - "8083:8083"
    environment:
      STORAGE_BOOKS_PATH: /app/books
      STORAGE_COVERS_PATH: /app/covers
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ${BOOKS_PATH:-./books}:/app/books
      - ${COVERS_PATH:-./covers}:/app/covers
    restart: on-failure

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: dl-api-gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8081
      BOOK_CATALOG_SERVICE_URL: http://book-catalog-service:8091
      COMMENT_RATING_SERVICE_URL: http://comment-rating-service:8082
      STORAGE_SERVICE_URL: http://storage-service:8083
      AI_SERVICE_URL: http://ai-service:8085
    depends_on:
      user-service:
        condition: service_healthy
      book-catalog-service:
        condition: service_healthy
      comment-rating-service:
        condition: service_healthy
      storage-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    restart: on-failure

  # ─── AI Service ───────────────────────────────────────────────────────────────

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: dl-ai-service
    ports:
      - "8085:8085"
    environment:
      FORCE_CPU: "true"
      SERVICE_PORT: "8085"
      DEBUG: "false"
      LOG_LEVEL: INFO
      # Microservice URLs (docker network)
      USER_SERVICE_URL: http://user-service:8081
      BOOK_CATALOG_SERVICE_URL: http://book-catalog-service:8091
      COMMENT_RATING_SERVICE_URL: http://comment-rating-service:8082
      # Vector DB
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      # Cache
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      # Security
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      # Persistent cache for HuggingFace/sentence-transformers models
      - models-cache:/root/.cache
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./digital-library-frontend
      dockerfile: Dockerfile
    container_name: dl-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

