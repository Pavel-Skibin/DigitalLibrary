# ──────────────────────────────────────────────────────────────────────────────
# CI: запускается при каждом push или PR в ветку dev
# Что делает:
#   1. Собирает все Java-модули через Maven (multi-module)
#   2. Запускает unit-тесты
# Фронтенд НЕ собирается в CI — src/foliate-js/ не хранится в git.
# Сборка фронтенда происходит на сервере через docker compose build frontend.
# ──────────────────────────────────────────────────────────────────────────────

name: CI — Build & Test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  # ─── Java: сборка и тесты ───────────────────────────────────────────────────
  build-java:
    name: Java Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: "**/target/surefire-reports/TEST-*.xml"
