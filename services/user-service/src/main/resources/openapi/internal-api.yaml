openapi: 3.0.3
info:
  title: User Service Internal API
  description: Internal API for inter-service communication (not exposed via API Gateway)
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local development

paths:
  /api/internal/users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Internal User API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found

  /api/internal/users/validate/{id}:
    get:
      summary: Validate if user exists
      operationId: validateUser
      tags:
        - Internal User API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"

  /api/internal/users/batch:
    post:
      summary: Get multiple users by IDs
      operationId: getUsersBatch
      tags:
        - Internal User API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
      responses:
        "200":
          description: Users map (userId -> UserResponse)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/UserResponse"

  /api/internal/statistics/users/count:
    get:
      summary: Get total users count
      operationId: getTotalUsersCount
      tags:
        - Internal Statistics API
      responses:
        "200":
          description: Total users count
          content:
            application/json:
              schema:
                type: integer
                format: int64

  /api/internal/statistics/users/by-role:
    get:
      summary: Get users count grouped by role
      operationId: getUsersByRole
      tags:
        - Internal Statistics API
      responses:
        "200":
          description: Users count by role
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleStatistics"

  /api/internal/users/{userId}/history:
    get:
      summary: Get user reading history
      description: Returns reading history with aggregated statistics for AI recommendation service
      operationId: getUserHistory
      tags:
        - Internal User API
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: User reading history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookViewResponse"
        "404":
          description: User not found

  /api/internal/users/{userId}/favorites:
    get:
      summary: Get user favorite book IDs
      description: Returns list of book IDs that user added to favorites
      operationId: getUserFavorites
      tags:
        - Internal User API
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: List of favorite book IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int32

  /api/internal/users/{userId}/viewed-books:
    get:
      summary: Get user viewed book IDs
      description: Returns list of all book IDs that user has viewed (for exclusion in recommendations)
      operationId: getUserViewedBooks
      tags:
        - Internal User API
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: List of viewed book IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int32

components:
  schemas:
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - role
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        email:
          type: string
        role:
          type: string
          description: Role name (USER, MODERATOR, ADMIN)
        isDeleted:
          type: boolean

    ValidationResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
        message:
          type: string

    RoleStatistics:
      type: object
      properties:
        roleName:
          type: string
        userCount:
          type: integer
          format: int64

    BookViewResponse:
      type: object
      properties:
        bookId:
          type: integer
          format: int32
        viewCount:
          type: integer
          format: int32
        lastViewedAt:
          type: string
          format: date-time
        totalTimeSpent:
          type: integer
          format: int64
          description: Total time spent on book in seconds
        progressPercent:
          type: number
          format: double
