openapi: 3.0.3
info:
  title: User Service Internal API
  description: Internal API for inter-service communication (not exposed via API Gateway)
  version: 1.0.0
servers:
  - url: ${services.user.url:http://localhost:8081}
    description: User Service

paths:
  /api/internal/users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Internal User API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found

  /api/internal/users/validate/{id}:
    get:
      summary: Validate if user exists
      operationId: validateUser
      tags:
        - Internal User API
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"

  /api/internal/users/batch:
    post:
      summary: Get multiple users by IDs
      operationId: getUsersBatch
      tags:
        - Internal User API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
      responses:
        "200":
          description: Users map (userId -> UserResponse)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/UserResponse"

components:
  schemas:
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - role
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        email:
          type: string
        role:
          type: string
          description: Role name (USER, MODERATOR, ADMIN)
        isDeleted:
          type: boolean

    ValidationResponse:
      type: object
      required:
        - exists
      properties:
        exists:
          type: boolean
        message:
          type: string
