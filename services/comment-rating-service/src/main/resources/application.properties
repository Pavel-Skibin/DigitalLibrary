spring.application.name=comment-rating-service
server.port=${SERVER_PORT:8082}

# Database Configuration (Comments & Ratings DB)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comments_ratings_db}
spring.datasource.username=${DB_USERNAME:digital_library_user}
spring.datasource.password=${DB_PASSWORD:digital_library_user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration (ENABLED for migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# CORS - production server IP/domain (set CORS_ALLOWED_ORIGIN in .env, e.g. http://your-server-ip or https://your-domain.com)
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost}

# JWT Configuration (Read from environment variables)
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400}

# Logging
logging.level.org.nahap.commentratingservice=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Microservices URLs
services.user.url=${USER_SERVICE_URL:http://localhost:8081}
services.book.url=${BOOK_SERVICE_URL:http://localhost:8091}

# OpenFeign Configuration
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000
feign.client.config.default.logger-level=basic
