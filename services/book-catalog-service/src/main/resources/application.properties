spring.application.name=book-catalog-service
server.port=${SERVER_PORT:8091}

# Database Configuration (Book Catalog DB)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/books_db}
spring.datasource.username=${DB_USERNAME:digital_library_user}
spring.datasource.password=${DB_PASSWORD:digital_library_user}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Flyway Configuration (ENABLED for migrations)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# CORS - production server IP/domain (set CORS_ALLOWED_ORIGIN in .env, e.g. http://your-server-ip or https://your-domain.com)
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:http://localhost}

# JWT Configuration (Read from environment variables)
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.header=Authorization

# File Storage (override via APP_BOOKS_STORAGE_PATH env var in production)
app.books.storage-path=${APP_BOOKS_STORAGE_PATH:/app/books}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB

# Logging
logging.level.org.nahap.digital_library_backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI/Swagger
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Feign Client Configuration
services.comment-rating.url=${COMMENT_RATING_SERVICE_URL:http://localhost:8082}
services.user.url=${USER_SERVICE_URL:http://localhost:8081}

# Feign Logging
logging.level.org.nahap.bookcatalogservice.client=DEBUG
feign.client.config.default.loggerLevel=full
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

server.address=0.0.0.0









