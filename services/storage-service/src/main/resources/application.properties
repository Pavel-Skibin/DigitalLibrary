spring.application.name=storage-service
server.port=${SERVER_PORT:8083}

# File Storage Configuration (Read from environment variables)
storage.books-path=${STORAGE_BOOKS_PATH:/app/books}
storage.covers-path=${STORAGE_COVERS_PATH:/app/covers}
storage.max-file-size=${STORAGE_MAX_FILE_SIZE:52428800}

# JWT Configuration (Read from environment variables)
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.org.nahap.storageservice=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
