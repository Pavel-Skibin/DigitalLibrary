version: "3.8"

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-service-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - D:/ProgramFiles/Qdrant/storage:/qdrant/storage
      - D:/ProgramFiles/Qdrant/snapshots:/qdrant/snapshots
    restart: unless-stopped
    networks:
      - ai-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  redis-data:
