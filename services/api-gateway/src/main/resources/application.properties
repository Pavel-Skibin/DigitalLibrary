spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.nahap.apigateway=INFO

# Service URLs (Read from environment variables)
services.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
services.book-catalog-service.url=${BOOK_CATALOG_SERVICE_URL:http://localhost:8091}
services.comment-rating-service.url=${COMMENT_RATING_SERVICE_URL:http://localhost:8082}
services.storage-service.url=${STORAGE_SERVICE_URL:http://localhost:8083}
services.ai-service.url=${AI_SERVICE_URL:http://127.0.0.1:8085}

# Spring Cloud Gateway Routes
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${services.user-service.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/auth/**, /api/readings/**, /api/favorites/**

spring.cloud.gateway.routes[1].id=book-catalog-service
spring.cloud.gateway.routes[1].uri=${services.book-catalog-service.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/books/**, /api/authors/**, /api/genres/**, /api/statistics/**

spring.cloud.gateway.routes[2].id=comment-rating-service
spring.cloud.gateway.routes[2].uri=${services.comment-rating-service.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/comments/**, /api/ratings/**, /api/bookmarks/**

spring.cloud.gateway.routes[3].id=storage-service
spring.cloud.gateway.routes[3].uri=${services.storage-service.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/storage/**

# AI Service - ML recommendations
spring.cloud.gateway.routes[4].id=ai-service
spring.cloud.gateway.routes[4].uri=${services.ai-service.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/recommendations/**, /api/embeddings/**, /api/ai/**

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.default.slidingWindowSize=10
resilience4j.circuitbreaker.instances.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.default.failureRateThreshold=50

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

