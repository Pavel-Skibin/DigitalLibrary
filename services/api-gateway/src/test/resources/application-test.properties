spring.application.name=api-gateway-test
server.port=0

# Используем заглушки для downstream-сервисов, чтобы контекст стартовал без реальных URL
services.user-service.url=http://localhost:9991
services.book-catalog-service.url=http://localhost:9992
services.comment-rating-service.url=http://localhost:9993
services.storage-service.url=http://localhost:9994
services.ai-service.url=http://localhost:9995

# Отключаем метрики Prometheus чтобы не требовался micrometer-registry-prometheus
management.endpoints.web.exposure.include=health,info
